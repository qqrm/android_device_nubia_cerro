name: Deploy to Cerro phone

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'check: SSH readiness; deploy: build, update and test inference'
        type: choice
        required: true
        default: check
        options: [check, deploy, start, stop, status]

permissions:
  contents: read

# Never cancel a phone update because another run was requested.
concurrency:
  group: cerro-phone
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  settings:
    name: Check phone configuration
    if: github.repository == 'qqrm/android_device_nubia_cerro' && github.ref == 'refs/heads/server-lite'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    environment: phone
    steps:
      - name: Require one-time configuration
        env:
          PHONE_HOST: ${{ vars.PHONE_HOST }}
          PHONE_USER: ${{ vars.PHONE_USER }}
          PHONE_PORT: ${{ vars.PHONE_PORT || '8022' }}
          PHONE_SSH_KEY: ${{ secrets.PHONE_SSH_KEY }}
          PHONE_KNOWN_HOSTS: ${{ secrets.PHONE_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in PHONE_HOST PHONE_USER PHONE_SSH_KEY PHONE_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing phone environment setting: ${name}. See server/termux/DEPLOY.md."
              missing=1
            fi
          done
          if [[ ! "$PHONE_PORT" =~ ^[0-9]{1,5}$ ]] || (( 10#$PHONE_PORT < 1 || 10#$PHONE_PORT > 65535 )); then
            echo '::error::PHONE_PORT must be an integer between 1 and 65535.'
            missing=1
          fi
          exit "$missing"

  build:
    name: Build trusted Android kit
    needs: settings
    if: inputs.operation == 'deploy'
    uses: ./.github/workflows/server-kit.yml
    permissions:
      contents: read
    # No phone credentials are passed to the hosted build.

  phone:
    name: Connect and operate phone
    needs: [settings, build]
    if: >-
      always() && !cancelled() && needs.settings.result == 'success' &&
      (inputs.operation != 'deploy' || needs.build.result == 'success')
    # Only this manually dispatched job uses the runner next to the phone.
    # PR validation and compilation stay on GitHub-hosted machines.
    runs-on: [self-hosted, linux, cerro-phone]
    timeout-minutes: 15
    environment: phone
    permissions:
      contents: read
    steps:
      - name: Checkout trusted phone tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check local runner tools
        run: |
          for tool in python3 ssh ssh-keygen sha256sum tar; do
            command -v "$tool" > /dev/null
          done
          python3 -c 'import sys; sys.exit(sys.version_info < (3, 10))'

      - name: Download this run's Android kit
        if: inputs.operation == 'deploy'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: cerro-server-android-arm64-cpu
          path: dist

      - name: Verify archive and bundle before connecting
        if: inputs.operation == 'deploy'
        working-directory: dist
        run: |
          sha256sum -c cerro-server-android-arm64-cpu.tar.gz.sha256
          mkdir unpacked
          tar --extract --gzip --file cerro-server-android-arm64-cpu.tar.gz --directory unpacked --no-same-owner --no-same-permissions
          python3 ../server/cerro.py verify --bundle unpacked/cerro-server
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          provenance = json.loads(Path('unpacked/cerro-server/provenance.json').read_text())
          if provenance['kit_commit'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Bundle commit does not match this workflow run')
          PY

      - name: Create temporary SSH directory
        run: |
          umask 077
          ssh_dir=$(mktemp -d "${RUNNER_TEMP}/cerro-ssh.XXXXXXXX")
          printf 'CERRO_SSH_DIR=%s\n' "$ssh_dir" >> "$GITHUB_ENV"

      - name: Prepare pinned SSH identity
        env:
          PHONE_SSH_KEY: ${{ secrets.PHONE_SSH_KEY }}
          PHONE_KNOWN_HOSTS: ${{ secrets.PHONE_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$PHONE_SSH_KEY" > "${CERRO_SSH_DIR}/key"
          printf '%s\n' "$PHONE_KNOWN_HOSTS" > "${CERRO_SSH_DIR}/known_hosts"
          ssh-keygen -y -P '' -f "${CERRO_SSH_DIR}/key" > /dev/null
          ssh-keygen -F cerro-phone -f "${CERRO_SSH_DIR}/known_hosts" > /dev/null

      - name: Run selected operation
        env:
          PHONE_HOST: ${{ vars.PHONE_HOST }}
          PHONE_USER: ${{ vars.PHONE_USER }}
          PHONE_PORT: ${{ vars.PHONE_PORT || '8022' }}
          OPERATION: ${{ inputs.operation }}
        run: |
          args=(--host "$PHONE_HOST" --user "$PHONE_USER" --port "$PHONE_PORT"
                --ssh-key "${CERRO_SSH_DIR}/key"
                --known-hosts "${CERRO_SSH_DIR}/known_hosts")
          case "$OPERATION" in
            deploy)
              python3 server/phone.py "${args[@]}" deploy --bundle dist/unpacked/cerro-server
              ;;
            check|start|stop|status)
              python3 server/phone.py "${args[@]}" "$OPERATION"
              ;;
            *) echo '::error::Unsupported operation'; exit 1 ;;
          esac
          printf '## Phone operation\n\n`%s` completed successfully over pinned SSH.\n' "$OPERATION" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary SSH credentials
        if: always()
        run: |
          if [[ -n "${CERRO_SSH_DIR:-}" ]]; then
            rm -rf -- "$CERRO_SSH_DIR"
          fi
